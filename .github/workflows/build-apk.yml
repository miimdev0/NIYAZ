name: Build Niyaz APK

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Sanity check web sources
        run: |
          node --check www/script.js
          node --check www/cal.js
          node --check www/content.js
          node --check www/nat.js
          test -f www/audio/azan.mp3
          test -f www/fonts/Doran.ttf
          echo "web sources ok"

      - name: Patch Android project (alarm service, adhan screen, widget, permissions)
        run: python3 .github/scripts/patch_android.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niyaz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
