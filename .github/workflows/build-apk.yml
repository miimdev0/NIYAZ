name: Build Niyaz APK

on:
  push:
    branches: [main, master, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Sanity check web sources
        run: |
          node --check www/script.js
          node --check www/cal.js
          node --check www/content.js
          node --check www/nat.js
          test -f www/audio/azan.mp3
          test -f www/fonts/Doran.ttf
          echo "web sources ok"

      - name: Patch Android project (alarm service, adhan screen, widget, permissions)
        run: python3 .github/scripts/patch_android.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contents (native classes, sounds, fonts, manifest)
        run: |
          set -u
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -l "$APK"
          fail=0
          check() { if unzip -l "$APK" | grep -q -- "$1"; then echo "ok    $1"; else echo "MISSING  $1"; fail=1; fi; }
          check "res/raw/azan.mp3"
          check "res/raw/soft.mp3"
          check "assets/public/index.html"
          check "assets/public/script.js"
          check "assets/public/cal.js"
          check "assets/public/content.js"
          check "assets/public/nat.js"
          check "assets/public/audio/azan.mp3"
          check "assets/public/fonts/Doran.ttf"

          rm -rf /tmp/apkx && mkdir -p /tmp/apkx && (cd /tmp/apkx && unzip -qo "$GITHUB_WORKSPACE/$APK")
          for s in AzanService AzanActivity NiyazWidgetProvider AlarmModule BootReceiver AlarmScheduler Notifier WidgetUpdate; do
            if grep -a -q "$s" /tmp/apkx/classes*.dex; then echo "dex ok    $s"; else echo "dex MISSING  $s"; fail=1; fi
          done
          for s in android.permission.USE_EXACT_ALARM android.permission.POST_NOTIFICATIONS android.appwidget.action.APPWIDGET_UPDATE android.permission.FOREGROUND_SERVICE_SPECIAL_USE; do
            if strings -el /tmp/apkx/AndroidManifest.xml 2>/dev/null | grep -q "$s" || strings -a /tmp/apkx/AndroidManifest.xml 2>/dev/null | grep -q "$s"; then
              echo "manifest ok    $s"
            else
              echo "manifest MISSING  $s"; fail=1
            fi
          done
          if [ "$fail" != "0" ]; then echo "::error::محتوای APK ناقص است"; exit 1; fi
          echo "APK verified ✔  ($(du -h "$APK" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niyaz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
